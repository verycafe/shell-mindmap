name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Use the supported npm version
        run: npm install --global npm@11.10.1
      - name: Install the locked dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Build and test
        run: npm test
      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with:
          python-version: '3.12'
      - name: Verify Python can launch Node
        if: runner.os != 'Windows'
        run: python3 -c "import shutil, subprocess; node = shutil.which('node'); assert node, 'node is missing from Python PATH'; subprocess.run([node, '--version'], check=True)"
      - name: Terminal workflows
        if: runner.os != 'Windows'
        run: npm run test:pty
      - name: Check package contents without publishing
        run: npm pack --dry-run
